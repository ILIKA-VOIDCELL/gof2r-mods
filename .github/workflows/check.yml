# A pull request's submissions: only files in submissions/ (unless a maintainer opened it), each changed by its owner,
# each mod's zip downloaded and checked as the game reads it. Runs main's tools, not the pull request's.
name: Check submission

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The checker and catalog from main
        run: git checkout "origin/${BASE}" -- tools catalog.json
        env:
          BASE: ${{ github.base_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Changed files
        run: git diff --name-only --no-renames "origin/${BASE}...HEAD" > "$RUNNER_TEMP/changed.txt"
        env:
          BASE: ${{ github.base_ref }}
      - name: Check
        run: python tools/catalog.py check --author "$AUTHOR" --base "origin/${BASE}" --files-from "$RUNNER_TEMP/changed.txt"
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.base_ref }}
