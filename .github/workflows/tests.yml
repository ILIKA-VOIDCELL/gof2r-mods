name: Tests

on:
  push:
    branches: [main]
    paths: ["tools/**"]
  pull_request:
    paths: ["tools/**"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python -m unittest discover -s tools -v
